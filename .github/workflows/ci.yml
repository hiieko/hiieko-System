# HIIEKO System CI Pipeline
# This workflow runs typecheck, tests, and builds for the monorepo

name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: Typecheck all packages
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run typecheck
        run: npm run typecheck

  # Job 2: Run tests
  test:
    name: Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate Prisma Client (for backend tests)
        run: npm run prisma:generate --workspace=backend
      
      - name: Run backend tests
        run: npm run test

  # Job 3: Build all packages
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, test]  # Build only after typecheck and tests pass
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=backend
      
      - name: Run build
        run: npm run build
